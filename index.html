<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业语音听写工作站</title>
    <style>
        body { padding: 20px; font-family: sans-serif; background-color: #f0f2f5; }
        .controls { margin-bottom: 15px; }
        button { padding: 10px 20px; font-size: 16px; margin-right: 10px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        #startBtn { background-color: #28a745; color: white; }
        #startBtn:disabled { background-color: #94d3a2; cursor: not-allowed; }
        #endBtn { background-color: #dc3545; color: white; }
        #endBtn:disabled { background-color: #e49aa1; cursor: not-allowed; }
        #inputBox { width: 100%; height: 60vh; padding: 15px; font-size: 18px; outline: none; box-sizing: border-box; }
        #status { margin-bottom: 10px; color: #666; font-weight: bold; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="startBtn">▶ 开始演讲</button>
        <button id="endBtn" disabled>⏹ 结束演讲并保存文件</button>
    </div>
    <div id="status">系统待命中，请点击“开始演讲”初始化会话...</div>
    <textarea id="inputBox" placeholder="点击上方开始按钮后，在此处使用豆包输入法讲话..."></textarea>

    <script>
        const inputBox = document.getElementById('inputBox');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');
        const statusDiv = document.getElementById('status');

        const HOST = 'http://10.0.2.2:5000';
        const CUT_THRESHOLD = 150; // 黄金落盘区间

        let isRecording = false;
        let cursor = 0; // 隐形游标初始化

        // 初始化会话
        startBtn.addEventListener('click', async () => {
            try {
                await fetch(HOST + '/start', { method: 'POST' });
                isRecording = true;
                cursor = 0;
                inputBox.value = '';
                startBtn.disabled = true;
                endBtn.disabled = false;
                statusDiv.innerText = "🔴 正在记录演讲 (隐形游标备份模式运行中...)";
                statusDiv.style.color = "#dc3545";
            } catch (err) {
                alert("无法连接到中继网关，请确保 AHK/Python 服务已运行。");
            }
        });

        // 终结会话并封档
        endBtn.addEventListener('click', async () => {
            if (!isRecording) return;
            isRecording = false;

            // 获取游标到末尾的所有剩余字符
            const remainingText = inputBox.value.substring(cursor);
            
            try {
                await fetch(HOST + '/end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: remainingText })
                });
                startBtn.disabled = false;
                endBtn.disabled = true;
                statusDiv.innerText = "✅ 演讲已结束，全文已安全封档至本地 TXT 文件！";
                statusDiv.style.color = "#28a745";
                cursor = inputBox.value.length; // 游标推至末尾，锁定状态
            } catch (err) {
                alert("文件尾部保存失败，请检查网络连接。");
            }
        });

        // 核心：无侵入式状态驱动更新
        inputBox.addEventListener('input', () => {
            if (!isRecording) return;

            const text = inputBox.value;
            const uncommittedText = text.substring(cursor);

            // 1. 流式上屏：只将游标之后的“活跃文本”发送给 AHK 悬浮窗
            fetch(HOST + '/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: uncommittedText })
            }).catch(console.error);

            // 2. 隐形切割与追加存盘
            if (uncommittedText.length > CUT_THRESHOLD) {
                // 正则表达式：贪婪匹配直到最后一个标点符号，防止将句子切断
                const match = uncommittedText.match(/^[\s\S]*[。！？\.\!\?]/);
                if (match) {
                    const commitText = match[0];
                    fetch(HOST + '/commit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: commitText })
                    }).catch(console.error);

                    // 关键动作：推进游标，但不触碰物理 inputBox.value
                    cursor += commitText.length;
                }
            }
        });
    </script>
</body>
</html>
