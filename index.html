<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音听写工作站 V2.1</title>
    <style>
        body { padding: 20px; background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px 24px; font-size: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; }
        #startBtn { background-color: #28a745; color: white; }
        #startBtn:disabled { background-color: #ccc; cursor: not-allowed; }
        #endBtn { background-color: #dc3545; color: white; }
        #endBtn:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { font-size: 14px; color: #666; }
        #inputBox { width: 100%; height: 70vh; padding: 20px; font-size: 18px; line-height: 1.6; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; resize: none; }
        #inputBox:focus { border-color: #007bff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="btn-group">
            <button id="startBtn">▶ 开始记录存盘</button>
            <button id="endBtn" disabled>⏹ 结束记录并封档</button>
        </div>
        <div id="status">显示模式：常驻开启 | 录制模式：待命</div>
    </div>

    <textarea id="inputBox" placeholder="在此处开始说话，字幕将实时上屏..."></textarea>

    <script>
        const inputBox = document.getElementById('inputBox');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');
        const statusDiv = document.getElementById('status');

        const HOST = 'http://10.0.2.2:5000'; 
        const CUT_THRESHOLD = 150; // 每积攒 150 字尝试一次存盘

        let isRecording = false;
        let cursor = 0; // 虚拟游标，记录已经“存盘确定”的位置

        // 初始化记录
        startBtn.addEventListener('click', async () => {
            try {
                await fetch(HOST + '/start', { method: 'POST' });
                
                isRecording = true;
                const currentAllText = inputBox.value;
                
                // 追溯保存：将当前框内已有内容全部存盘
                if (currentAllText.length > 0) {
                    await fetch(HOST + '/commit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: currentAllText })
                    });
                }
                
                cursor = currentAllText.length; // 游标跳转至末尾
                startBtn.disabled = true;
                endBtn.disabled = false;
                statusDiv.innerText = "显示模式：常驻开启 | 录制模式：🔴 正在保存中...";
                statusDiv.style.color = "#dc3545";
            } catch (err) {
                alert("无法连接到 Python 服务，请确认服务已启动。");
            }
        });

        // 结束记录
        endBtn.addEventListener('click', async () => {
            if (!isRecording) return;
            
            const remainingText = inputBox.value.substring(cursor);
            try {
                await fetch(HOST + '/end', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: remainingText })
                });
                
                isRecording = false;
                cursor = inputBox.value.length; // 锁定游标
                startBtn.disabled = false;
                endBtn.disabled = true;
                statusDiv.innerText = "显示模式：常驻开启 | 录制模式：✅ 已封档";
                statusDiv.style.color = "#28a745";
            } catch (err) {
                alert("封档请求失败。");
            }
        });

       // 核心监听：流式显示 + 虚拟存盘
        inputBox.addEventListener('input', () => {
            const fullText = inputBox.value;
            
            // 【核心防御】：如果发现当前总长度比虚拟游标还要小，说明发生了物理删除/清场
            // 此时强制重置游标为 0，防止 substring 截取发生黑洞截断
            if (fullText.length < cursor) {
                cursor = 0;
            }
            
            const activeText = fullText.substring(cursor); // 游标之后即为“活跃文本”

            // 1. 无条件流式上屏（发往 AHK）
            // 【核心修复】：无论 activeText 有多长，我们强制只截取最后 300 个字发给 AHK。
            // 彻底解决 AHK 的 2048 字节 UDP 缓冲区溢出导致的字幕假死问题。
            const streamText = activeText.length > 300 ? activeText.slice(-300) : activeText;
            
            fetch(HOST + '/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: streamText }) // 这里改为发送 streamText
            }).catch(() => {});

            // 2. 有条件虚拟存盘（发往 Python 文件）
            if (isRecording && activeText.length > CUT_THRESHOLD) {
                // 寻找活跃文本中最后一个结束标点
                const match = activeText.match(/^[\s\S]*[。！？\.\!\?]/);
                if (match) {
                    const commitChunk = match[0];
                    fetch(HOST + '/commit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: commitChunk })
                    }).catch(console.error);

                    // 推进游标，但不触碰 textarea 物理内容，不干扰输入法
                    cursor += commitChunk.length;
                }
            }
        });
    </script>
</body>
</html>
